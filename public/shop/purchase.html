<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ซื้อแพ็กเกจร้านค้า | ระบบสมาชิก</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/shop.css">
  <script src="/js/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/">
      <div class="brand-logo"><img src="/img/logo.svg" alt="QPage"></div>
      <span class="brand-name">ระบบสมาชิก</span>
    </a>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="theme-toggle" type="button" aria-label="สลับธีม" style="position:static;">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="btn btn-outline btn-small" href="/settings/profile">บัญชีของฉัน</a>
    </div>
  </nav>

  <header class="pkg-hero">
    <div class="pkg-hero-inner">
      <span class="pkg-eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 16V8a2 2 0 00-1-1.7l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.7l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3.3 7L12 12l8.7-5M12 22V12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        แพ็กเกจร้านค้า
      </span>
      <h1>เปิดร้านอาหารออนไลน์<br>ให้ลูกค้าสแกนสั่งเองได้ทันที</h1>
      <p>เลือกแพ็กเกจที่เหมาะกับร้านของคุณ — เริ่มสร้างร้าน จัดการเมนู และแชร์หน้าร้านให้ลูกค้าได้ในไม่กี่นาที</p>
    </div>
  </header>

  <div class="shop-wrap pkg-wrap">
    <div id="notice"></div>
    <div class="pkg-grid" id="pkgGrid">
      <div class="pkg-loading">กำลังโหลด...</div>
    </div>
  </div>

  <script>
    window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data;
      try { data = await res.json(); } catch { const e = new Error('เซิร์ฟเวอร์ตอบสนองไม่ถูกต้อง (HTTP ' + res.status + ')'); e.status = res.status; throw e; }
      if (!data.ok) { const e = new Error(data.message || 'เกิดข้อผิดพลาด'); e.status = res.status; throw e; }
      return data;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function money(v) { return Number(v || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

    const ICON_CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const ICON_ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    let payment = null;      // รายการที่รอชำระเงินอยู่
    let cancelled = null;    // รายการล่าสุดที่ถูกยกเลิก/หมดเวลา (ถ้ามี)
    let packages = [];       // แพ็กเกจที่เปิดขาย
    let payEnabled = false;  // เปิดรับชำระเงินจริงหรือไม่ (ปิด = โหมดทดลอง)
    let confirmPkg = null;   // แพ็กเกจที่รอลูกค้ายืนยันในโหมดทดลอง

    // ---------- การ์ดแพ็กเกจ ----------
    function renderCard(p) {
      const details = (p.details || []).filter((d) => d.heading || d.text);
      const features = details.length
        ? `<ul class="pkg-features">${details.map((d) => `<li><span class="pkg-check">${ICON_CHECK}</span><div><strong>${esc(d.heading)}</strong>${d.text ? '<span class="pkg-desc">' + esc(d.text) + '</span>' : ''}</div></li>`).join('')}</ul>`
        : '<ul class="pkg-features"></ul>';
      return `<article class="pkg-card-v2">
        <div class="pkg-card-top">
          <h2>${esc(p.name)}</h2>
          <span class="pkg-duration">${esc(p.duration_months)} เดือน</span>
        </div>
        <div class="pkg-price-row">
          <span class="pkg-currency">฿</span><span class="pkg-amount">${money(p.price)}</span>
          <span class="pkg-per">/ ${esc(p.duration_months)} เดือน</span>
        </div>
        ${features}
        <div class="error-msg" data-err="${p.id}"></div>
        <button class="pkg-cta" data-buy="${p.id}" type="button">เลือกแพ็กเกจนี้ ${ICON_ARROW}</button>
      </article>`;
    }

    function renderEmpty(message) {
      return `<div class="pkg-empty-v2">
        <div class="pkg-empty-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M21 16V8a2 2 0 00-1-1.7l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.7l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.3 7L12 12l8.7-5M12 22V12" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
        <h3>ยังไม่มีแพ็กเกจที่เปิดขาย</h3>
        <p>${esc(message)}</p>
      </div>`;
    }

    async function loadPackages() {
      const grid = document.getElementById('pkgGrid');
      try {
        const data = await api('/api/packages');
        packages = data.packages || [];
      } catch (err) {
        grid.innerHTML = renderEmpty('โหลดแพ็กเกจไม่สำเร็จ: ' + err.message);
        return;
      }
      if (!packages.length) {
        grid.innerHTML = renderEmpty('กรุณาติดต่อผู้ดูแลระบบเพื่อเปิดขายแพ็กเกจ');
        return;
      }
      grid.innerHTML = packages.map(renderCard).join('');
      grid.querySelectorAll('[data-buy]').forEach((btn) => btn.addEventListener('click', () => buy(btn)));
    }

    // ---------- ขั้นตอนชำระเงิน ----------
    function renderPayment(msg) {
      const p = payment;
      const activeMsg = msg || '';
      document.getElementById('notice').innerHTML = '';
      document.getElementById('pkgGrid').innerHTML = `<div class="pay-box">
        <div class="pay-head">
          <span class="pill ${p.notified ? 'pill-valid' : 'pill-warning'}">${p.notified ? 'แจ้งโอนแล้ว — รอตรวจสอบยอด' : 'รอชำระเงิน'}</span>
          <h2>${esc(p.packageName)} · ${esc(p.durationMonths)} เดือน</h2>
          <div class="pay-amount">฿${money(p.amount)}</div>
          <div class="pay-ref">รหัสอ้างอิง <strong class="mono">${esc(p.ref)}</strong></div>
          ${!p.notified && p.expiresAtMs ? `<div class="pay-countdown">เหลือเวลา <b id="payCountdown">–</b></div>` : ''}
        </div>
        ${p.qrUrl ? `<div class="pay-qr">
          <img src="${esc(p.qrUrl)}" alt="PromptPay QR" width="230" height="230">
          <p>สแกนด้วยแอปธนาคาร — ยอดเงินถูกกรอกให้แล้ว</p>
        </div>` : ''}
        ${p.bank ? `<div class="pay-bank">
          <div class="pay-bank-title">หรือโอนผ่านธนาคาร</div>
          <div>ธนาคาร: <strong>${esc(p.bank.name)}</strong></div>
          <div>เลขที่บัญชี: <strong class="mono">${esc(p.bank.account)}</strong></div>
          ${p.bank.holder ? `<div>ชื่อบัญชี: <strong>${esc(p.bank.holder)}</strong></div>` : ''}
          <div class="pay-bank-hint">ใส่รหัสอ้างอิง <strong class="mono">${esc(p.ref)}</strong> ในบันทึกโอนด้วย</div>
        </div>` : ''}
        ${p.payNote ? `<p class="pay-note">${esc(p.payNote)}</p>` : ''}
        ${activeMsg ? `<p class="pay-msg">${esc(activeMsg)}</p>` : ''}
        ${p.slipUrl && p.notified ? `<div class="pay-qr"><img src="${esc(p.slipUrl)}" alt="สลิป" style="width:auto;max-height:220px;"></div>` : ''}
        ${p.notified ? '' : `<div class="pay-slip">
          <label for="slipFile">แนบสลิปโอนเงิน (แนะนำ — ระบบจะตรวจให้อัตโนมัติ)</label>
          <input type="file" id="slipFile" accept="image/png,image/jpeg,image/webp">
          <div class="pay-slip-name" id="slipName"></div>
        </div>`}
        <button class="pkg-cta" id="notifyBtn" type="button" ${p.notified ? 'disabled' : ''}>${p.notified ? 'แจ้งชำระเงินแล้ว' : 'แจ้งว่าชำระเงินแล้ว'}</button>
        <p class="pay-hint">หลังโอนเงินแล้วแนบสลิปและกดปุ่มด้านบน — ถ้าแนบสลิป ระบบจะตรวจและเปิดสิทธิ์ให้อัตโนมัติ ถ้าไม่แนบ ผู้ดูแลระบบจะตรวจสอบยอดให้</p>
      </div>`;

      const fileInput = document.getElementById('slipFile');
      if (fileInput) fileInput.addEventListener('change', () => {
        const f = fileInput.files && fileInput.files[0];
        document.getElementById('slipName').textContent = f ? 'เลือกไฟล์: ' + f.name : '';
      });
      const btn = document.getElementById('notifyBtn');
      if (btn && !p.notified) btn.addEventListener('click', notifyPaid);

      // นับถอยหลัง — ใช้เวลาหมดอายุจริงจากเซิร์ฟเวอร์ (รีเฟรชแล้วยังนับต่อถูกต้อง)
      if (!p.notified && p.expiresAtMs) startCountdown(p.expiresAtMs);
      else stopCountdown();
    }

    let countdownTimer = null;
    function stopCountdown() { if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; } }

    // นับถอยหลังจาก "เวลาหมดอายุจริง" ที่เซิร์ฟเวอร์กำหนด → ตรงกับหน้าหลังบ้านเป๊ะ แม้รีเฟรช
    function startCountdown(expiresAtMs) {
      stopCountdown();
      const paint = () => {
        const el = document.getElementById('payCountdown');
        if (!el) { stopCountdown(); return 0; }
        const left = Math.max(0, Math.round((Number(expiresAtMs) - Date.now()) / 1000));
        el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
        el.classList.toggle('low', left <= 60);
        return left;
      };
      if (paint() <= 0) { onPaymentExpired(); return; }
      countdownTimer = setInterval(() => {
        if (paint() <= 0) { stopCountdown(); onPaymentExpired(); }
      }, 250);
    }

    // หมดเวลา → ให้เซิร์ฟเวอร์ยกเลิกรายการ แล้วกลับไปหน้ารายการแพ็กเกจ
    async function onPaymentExpired() {
      const id = payment && payment.id;
      try { if (id) await api('/api/my-payments/' + id + '/expire', { method: 'POST' }); } catch (e) { /* ข้ามได้ */ }
      payment = null;
      await loadMineAndRender();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || ''));
        r.onerror = () => reject(new Error('อ่านไฟล์สลิปไม่สำเร็จ'));
        r.readAsDataURL(file);
      });
    }

    async function notifyPaid() {
      const btn = document.getElementById('notifyBtn');
      const input = document.getElementById('slipFile');
      const file = input && input.files && input.files[0];
      if (file && file.size > 2 * 1024 * 1024) { alert('ไฟล์สลิปใหญ่เกิน 2MB กรุณาย่อรูปก่อน'); return; }
      btn.disabled = true;
      try {
        const body = {};
        if (file) body.slip = await readFileAsDataUrl(file);
        const data = await api('/api/my-payments/' + payment.id + '/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (data.autoApproved) { window.location.replace('/shop/setup.html'); return; }
        payment.notified = true;
        renderPayment(data.message);
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    // เลือกแพ็กเกจ → เปิดรับเงินจริง = สร้างรายการรอโอน · โหมดทดลอง = ให้ยืนยันก่อน
    function buy(btn) {
      const errEl = document.querySelector('[data-err="' + btn.dataset.buy + '"]');
      if (errEl) errEl.style.display = 'none';
      const pkg = packages.find((p) => Number(p.id) === Number(btn.dataset.buy));
      if (!pkg) return;
      if (!payEnabled) {
        confirmPkg = pkg;
        renderMockConfirm();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      createPayment(pkg, btn);
    }

    async function createPayment(pkg, btn) {
      if (btn) { btn.disabled = true; btn.classList.add('loading'); }
      try {
        const data = await api('/api/shop/purchase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ packageId: Number(pkg.id) }),
        });
        if (data.pending && data.payment) { payment = data.payment; renderPayment(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        window.location.replace(data.redirect || '/shop/setup.html');
      } catch (err) {
        const errEl = document.querySelector('[data-err="' + pkg.id + '"]');
        if (errEl) { errEl.textContent = err.message; errEl.style.display = 'block'; }
        else alert(err.message);
        if (btn) { btn.disabled = false; btn.classList.remove('loading'); }
      }
    }

    // ขั้นยืนยันของโหมดทดลอง (ยังไม่เรียกเก็บเงิน) — ไม่กระโดดไปหน้าข้อมูลร้านทันที
    function renderMockConfirm() {
      const p = confirmPkg;
      const details = (p.details || []).filter((d) => d.heading || d.text);
      document.getElementById('notice').innerHTML = '';
      document.getElementById('pkgGrid').innerHTML = `<div class="pay-box">
        <div class="pay-head">
          <span class="pill pill-warning">โหมดทดลอง — ยังไม่เรียกเก็บเงิน</span>
          <h2>${esc(p.name)} · ${esc(p.duration_months)} เดือน</h2>
          <div class="pay-amount">฿${money(p.price)}</div>
          <div class="pay-ref">ระบบยังไม่เปิดรับชำระเงิน ยอดนี้จะไม่ถูกเรียกเก็บ</div>
        </div>
        ${details.length ? `<ul class="pkg-features">${details.map((d) => `<li><span class="pkg-check">${ICON_CHECK}</span><div><strong>${esc(d.heading)}</strong>${d.text ? '<span class="pkg-desc">' + esc(d.text) + '</span>' : ''}</div></li>`).join('')}</ul>` : ''}
        <p class="pay-hint">กดยืนยันแล้วบัญชีของคุณจะกลายเป็น “เจ้าของร้าน” ทันที และใช้งานได้ ${esc(p.duration_months)} เดือน</p>
        <div class="pay-actions">
          <button class="pkg-cta" id="mockConfirmBtn" type="button">ยืนยันเปิดร้าน</button>
          <button class="btn btn-outline" id="mockBackBtn" type="button">ย้อนกลับไปเลือกแพ็กเกจอื่น</button>
        </div>
      </div>`;
      document.getElementById('mockConfirmBtn').addEventListener('click', (e) => createPayment(p, e.currentTarget));
      document.getElementById('mockBackBtn').addEventListener('click', () => { confirmPkg = null; loadPackages(); });
    }

    // โหลดสถานะการชำระเงินของฉันแล้ววาดหน้าตามสถานะ (ใช้ซ้ำได้ เช่นตอนหมดเวลา)
    async function loadMineAndRender() {
      document.getElementById('notice').innerHTML = '';
      try {
        const mine = await api('/api/my-payments');
        const list = mine.payments || [];
        payment = list.find((p) => p.status === 'pending') || null;
        cancelled = list.find((p) => p.status === 'rejected' || p.status === 'expired') || null;
      } catch (err) { payment = null; }

      if (cancelled && !payment) {
        const msg = cancelled.status === 'expired'
          ? `รายการก่อนหน้า (รหัส ${esc(cancelled.ref)}) <b>หมดเวลาชำระเงิน</b> — ถ้าโอนไปแล้ว กรุณาแจ้งผู้ดูแลระบบพร้อมรูปสลิป ผู้ดูแลระบบจะตรวจสอบและเปิดสิทธิ์ให้ครับ`
          : `รายการก่อนหน้า (รหัส ${esc(cancelled.ref)}) ถูกยกเลิก: ${esc(cancelled.note || 'ไม่ระบุเหตุผล')} — เลือกแพ็กเกจใหม่ได้เลย`;
        document.getElementById('notice').innerHTML = `<div class="pkg-notice">${msg}</div>`;
      }
      if (payment) renderPayment();
      else await loadPackages();
    }

    (async function init() {
      try {
        const info = await api('/api/payment-info');
        payEnabled = Boolean(info.payment && info.payment.enabled);
      } catch (err) { /* ถ้าอ่านไม่ได้ให้ถือว่าโหมดทดลอง */ }
      await loadMineAndRender();
    })();
  </script>
</body>
</html>
