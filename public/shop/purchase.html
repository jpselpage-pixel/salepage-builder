<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ซื้อแพ็กเกจร้านค้า | ระบบสมาชิก</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/shop.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/">
      <div class="brand-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4H6z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 6h18M16 10a4 4 0 01-8 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="brand-name">ระบบสมาชิก</span>
    </a>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="theme-toggle" type="button" aria-label="สลับธีม" style="position:static;">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="btn btn-outline btn-small" href="/settings/profile">บัญชีของฉัน</a>
    </div>
  </nav>

  <div class="shop-wrap">
    <div class="shop-head">
      <h1>เปิดร้านค้าของคุณ</h1>
      <p>เลือกแพ็กเกจเพื่อเริ่มสร้างร้านอาหาร จัดการเมนู และแชร์หน้าร้านให้ลูกค้าดูได้ทันที</p>
    </div>

    <div class="pkg-grid" id="pkgGrid">
      <div class="pkg-empty">กำลังโหลดแพ็กเกจ...</div>
    </div>

    <p style="font-size:12.5px;color:var(--muted);margin-top:18px;">หมายเหตุ: เฟสนี้เป็นการซื้อแบบจำลอง ยังไม่ตัดเงินจริง — กดยืนยันแล้วบัญชีของคุณจะกลายเป็น “เจ้าของร้าน” ทันที</p>
  </div>

  <script>
    // ถ้ากด Back แล้วเบราว์เซอร์กู้หน้านี้จาก cache ให้โหลดใหม่ เพื่อให้เซิร์ฟเวอร์เช็คสิทธิ์ (ซื้อแล้วจะถูกพาไปหน้าอื่น)
    window.addEventListener('pageshow', (e) => { if (e.persisted) window.location.reload(); });

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data;
      try { data = await res.json(); } catch { const e = new Error('เซิร์ฟเวอร์ตอบสนองไม่ถูกต้อง (HTTP ' + res.status + ')'); e.status = res.status; throw e; }
      if (!data.ok) { const e = new Error(data.message || 'เกิดข้อผิดพลาด'); e.status = res.status; throw e; }
      return data;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function money(v) {
      return Number(v || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function renderCard(p) {
      const details = (p.details || []).filter((d) => d.heading || d.text);
      const list = details.length
        ? `<ul class="pkg-list">${details.map((d) => `<li><span class="pkg-ico">✓</span><span><strong>${esc(d.heading)}</strong>${d.text ? '<br>' + esc(d.text) : ''}</span></li>`).join('')}</ul>`
        : '';
      return `<div class="shop-card pkg-card">
        <h2>${esc(p.name)}</h2>
        <div class="pkg-price">฿${money(p.price)} <small>/ ${esc(p.duration_months)} เดือน</small></div>
        ${list}
        <div class="error-msg" data-err="${p.id}"></div>
        <button class="btn btn-primary" data-buy="${p.id}" type="button">เลือกแพ็กเกจนี้</button>
      </div>`;
    }

    async function loadPackages() {
      const grid = document.getElementById('pkgGrid');
      let packages = [];
      try {
        const data = await api('/api/packages');
        packages = data.packages || [];
      } catch (err) {
        grid.innerHTML = '<div class="pkg-empty">โหลดแพ็กเกจไม่สำเร็จ: ' + esc(err.message) + '</div>';
        return;
      }
      if (!packages.length) {
        grid.innerHTML = '<div class="pkg-empty">ยังไม่มีแพ็กเกจที่เปิดขายในขณะนี้<br>กรุณาติดต่อผู้ดูแลระบบ</div>';
        return;
      }
      grid.innerHTML = packages.map(renderCard).join('');
      grid.querySelectorAll('[data-buy]').forEach((btn) => btn.addEventListener('click', () => buy(btn)));
    }

    async function buy(btn) {
      const errEl = document.querySelector('[data-err="' + btn.dataset.buy + '"]');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.classList.add('loading');
      try {
        const data = await api('/api/shop/purchase', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ packageId: Number(btn.dataset.buy) }),
        });
        // ใช้ replace เพื่อไม่ให้กด Back กลับมาหน้าเลือกแพ็กเกจหลังซื้อแล้ว
        window.location.replace(data.redirect || '/shop/setup.html');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    loadPackages();
  </script>
</body>
</html>
