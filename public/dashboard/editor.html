<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตัวสร้างเพจ | SalePage Builder</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/editor.css">
  <script src="/js/theme.js"></script>
</head>
<body class="editor-body">
  <!-- Topbar -->
  <header class="editor-topbar">
    <div class="tb-left">
      <a class="btn btn-outline" href="/dashboard/pages" style="padding:8px 14px;font-size:13px;">← เพจ</a>
      <span class="tb-title" id="tbTitle">เพจ</span>
      <span class="tb-badge" id="tbBadge">ฉบับร่าง</span>
    </div>
    <div class="tb-actions">
      <span class="tb-saved" id="tbSaved"></span>
      <select class="props-select" id="zoomSelect" title="ซูมผ้าใบ" style="width:auto;padding:8px 10px;font-size:12.5px;">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
      </select>
      <a class="tb-view-link" id="viewLink" href="#" target="_blank" style="display:none;">เปิดดูเพจ ↗</a>
      <button class="btn btn-outline" type="button" id="saveBtn">บันทึก</button>
      <button class="btn btn-primary" type="button" id="publishBtn">เผยแพร่</button>
      <button class="theme-toggle" type="button" aria-label="สลับธีม" style="position:static;width:40px;height:40px;">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" style="display:none">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none">
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="editor-main">
    <!-- แถบเครื่องมือซ้าย -->
    <aside class="editor-tools">
      <div class="tools-title">เครื่องมือ</div>
      <button class="tool-btn" type="button" data-type="text">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6V4h16v2M12 4v16M9 20h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>ข้อความ</span>
      </button>
      <button class="tool-btn" type="button" data-type="button">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>ปุ่ม</span>
      </button>
      <button class="tool-btn" type="button" data-type="image">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="2" stroke="currentColor" stroke-width="1.8"/><path d="M21 15l-4.5-4.5L6 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>รูปภาพ</span>
      </button>
      <button class="tool-btn" type="button" data-type="price">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v10M14.5 9.5c0-1.4-1.1-2.5-2.5-2.5s-2.5 1.1-2.5 2.5 1.1 2.5 2.5 2.5 2.5 1.1 2.5 2.5-1.1 2.5-2.5 2.5-2.5-1.1-2.5-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>ราคา</span>
      </button>
      <div class="tools-divider"></div>
      <button class="tool-btn" type="button" data-type="heading">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6V4h16v2M12 4v16M9 20h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>หัวข้อ</span>
      </button>
      <button class="tool-btn" type="button" data-type="box">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>กล่อง</span>
      </button>
      <div class="tools-divider"></div>
      <button class="tool-btn" type="button" data-type="line">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 12a4 4 0 118 0M6.5 12a1.5 1.5 0 103 0M14.5 12a1.5 1.5 0 103 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>ปุ่มไลน์</span>
      </button>
      <button class="tool-btn" type="button" data-type="video">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M16 10l6-3v10l-6-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>วิดีโอ</span>
      </button>
      <button class="tool-btn" type="button" data-type="gallery">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.8"/><path d="M21 15l-4.5-4.5L6 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>แกลเลอรี่</span>
      </button>
      <div class="tools-divider"></div>
      <button class="tool-btn" type="button" data-type="countdown">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 9v4l3 2M9 2h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>นับถอยหลัง</span>
      </button>
      <button class="tool-btn" type="button" data-type="testimonial">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5L8 13.8 2 9.2h7.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>รีวิวลูกค้า</span>
      </button>
      <button class="tool-btn" type="button" data-type="faq">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9a2.5 2.5 0 114.7 1.2c-.7 1-2.2 1.5-2.2 2.8v.5M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>คำถามที่พบบ่อย</span>
      </button>
      <div class="tools-divider"></div>
      <button class="tool-btn" type="button" id="bgToolBtn">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.8"/><path d="M21 15l-5-5L6 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>พื้นหลัง</span>
      </button>
      <div class="tools-hint">คลิกเครื่องมือเพื่อเพิ่มลงผ้าใบ<br>จากนั้นลากย้าย / ปรับขนาดได้</div>
    </aside>

    <!-- ผ้าใบกลาง -->
    <div class="editor-canvas-wrap" id="canvasWrap">
      <div class="device-bar">
        <button class="device-btn active" type="button" data-device="mobile" title="มุมมองมือถือ">
          <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="2" width="10" height="20" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M11 18h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>มือถือ</span>
        </button>
        <button class="device-btn" type="button" data-device="tablet" title="มุมมองแท็บเล็ต">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="2" width="16" height="20" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M11 18h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>แท็บเล็ต</span>
        </button>
        <button class="device-btn" type="button" data-device="desktop" title="มุมมองเดสก์ท็อป">
          <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>เดสก์ท็อป</span>
        </button>
      </div>
      <div class="canvas-scroll" id="canvasScroll">
        <div class="editor-canvas" id="canvas"></div>
      </div>
    </div>

    <!-- แผงขวา: เลเยอร์ + คุณสมบัติ -->
    <aside class="editor-panel">
      <div class="panel-tabs">
        <button class="panel-tab active" type="button" data-tab="layers">เลเยอร์</button>
        <button class="panel-tab" type="button" data-tab="props">คุณสมบัติ</button>
      </div>
      <div class="panel-body" id="panelLayers"></div>
      <div class="panel-body" id="panelProps" style="display:none;"></div>
      <div class="panel-body" id="panelBg" style="display:none;"></div>
    </aside>
  </div>

  <!-- ตัวเลือกสี (ลากดูตัวอย่างได้) -->
  <div class="cp-pop" id="cpPop" style="display:none;">
    <div class="cp-sv" id="cpSv"><div class="cp-sv-handle"></div></div>
    <div class="cp-hue" id="cpHue"><div class="cp-hue-handle"></div></div>
    <div class="cp-swatches" id="cpSwatches"></div>
    <div class="cp-row">
      <input class="cp-hex" id="cpHex" type="text" spellcheck="false">
      <span class="cp-preview" id="cpPreview"></span>
    </div>
  </div>

  <script>
    // ============================================================
    // สถานะ
    // ============================================================
    const CANVAS_W = 375;
    let pageRef = window.location.pathname.split('/')[3] || '';  // slug หรือ id เก่า
    let page = null;
    let pageId = 0;
    let elements = [];        // [{id, type, x, y, w, h, props}]
    let pageBg = { type: 'solid', color: '#ffffff' };  // พื้นหลังเพจ
    let selectedId = null;
    let dirty = false;

    const canvas = document.getElementById('canvas');
    const canvasWrap = document.getElementById('canvasWrap');
    const canvasScroll = document.getElementById('canvasScroll');
    const panelLayers = document.getElementById('panelLayers');
    const panelProps = document.getElementById('panelProps');

    const TYPE_LABEL = { text: 'ข้อความ', button: 'ปุ่ม', image: 'รูปภาพ', price: 'ราคา',
      heading: 'หัวข้อ', box: 'กล่อง',
      line: 'ปุ่มไลน์', video: 'วิดีโอ', gallery: 'แกลเลอรี่',
      countdown: 'นับถอยหลัง', testimonial: 'รีวิวลูกค้า', faq: 'คำถามที่พบบ่อย' };

    // ============================================================
    // สร้าง element ใหม่
    // ============================================================
    function newElement(type) {
      const id = 'el_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const base = { id, type, x: 20, y: 20, w: 200, h: 50 };
      switch (type) {
        case 'text':
          return { ...base, h: 60, w: 280, props: { text: 'ข้อความของคุณ', fontSize: 20, bold: true, color: '#101828', align: 'center', link: '' } };
        case 'button':
          return { ...base, w: 200, h: 52, props: { label: 'สั่งซื้อเลย', bgColor: '#6366f1', textColor: '#ffffff', radius: 12, fontSize: 15, bold: true, link: '' } };
        case 'image':
          return { ...base, w: 335, h: 200, props: { src: '', alt: 'รูปสินค้า' } };
        case 'price':
          return { ...base, w: 200, h: 44, props: { amount: 1990, oldAmount: 3990, currency: '฿' } };
        case 'heading':
          return { ...base, w: 300, h: 50, props: { text: 'หัวข้อของคุณ', fontSize: 26, bold: true, color: '#101828', align: 'center' } };
        case 'box':
          return { ...base, w: 335, h: 200, props: { bgColor: '#f4f5fb', borderColor: '#d0d5dd', radius: 16, padding: 20 } };
        case 'line':
          return { ...base, w: 220, h: 52, props: { lineId: '@salepage', label: 'แอดไลน์รับโปรโมชัน' } };
        case 'video':
          return { ...base, w: 335, h: 190, props: { url: '' } };
        case 'gallery':
          return { ...base, w: 335, h: 200, props: { images: '' } };
        case 'countdown':
          return { ...base, w: 335, h: 90, props: { mode: 'timer', days: 2, hours: 12, minutes: 30, seconds: 0, alarmDate: '', alarmTime: '', label: 'โปรโมชันหมดเขตใน' } };
        case 'testimonial':
          return { ...base, w: 335, h: 150, props: { text: 'สินค้าดีมาก ส่งไว แพ็คเกจสวย แนะนำเลยครับ', name: 'คุณลูกค้า', stars: 5 } };
        case 'faq':
          return { ...base, w: 335, h: 170, props: { items: 'คำถามที่ 1?|คำตอบข้อ 1\nคำถามที่ 2?|คำตอบข้อ 2' } };
      }
      return base;
    }

    function addElement(type, y) {
      const el = newElement(type);
      el.x = Math.round((CANVAS_W - el.w) / 2);
      el.y = y;
      elements.push(el);
      selectElement(el.id);
      dirty = true;
      renderAll();
    }

    // ============================================================
    // เรนเดอร์ผ้าใบ
    // ============================================================
    function renderElInner(el) {
      const p = el.props || {};
      switch (el.type) {
        case 'text':
          const fs = Number(p.fontSize) || 16;
          const animClass = p.animation === 'blink' ? ' txt-anim-blink' : p.animation === 'glow' ? ' txt-anim-glow' : '';
          const shadowBlur = Number(p.shadowBlur) || 0;
          const shadow = shadowBlur > 0 ? ('text-shadow:0 2px ' + shadowBlur + 'px ' + (p.shadowColor || '#101828') + ';') : '';
          const glowVar = p.animation === 'glow' ? ('--glow-color:' + (p.shadowColor || '#6366f1') + ';') : '';
          const styles = 'font-size:' + fs + 'px;' +
            'font-weight:' + (p.bold ? '700' : '400') + ';' +
            'font-style:' + (p.italic ? 'italic' : 'normal') + ';' +
            'text-decoration:' + (p.underline ? 'underline' : 'none') + ';' +
            'text-transform:' + (p.uppercase ? 'uppercase' : 'none') + ';' +
            'font-family:' + (p.fontFamily || 'Inter') + ",'Noto Sans Thai',sans-serif;" +
            'color:' + (p.color || '#101828') + ';' +
            'line-height:' + (Number(p.lineHeight) || 1.5) + ';' +
            'letter-spacing:' + (Number(p.letterSpacing) || 0) + 'px;' +
            shadow + glowVar +
            'word-break:break-word;';
          const inner = escapeHtml(p.text || 'ข้อความของคุณ');
          const animAttr = ' class="' + animClass + '"';
          const content = p.link
            ? '<a href="' + escapeHtml(p.link) + '" target="_blank" rel="noopener"' + animAttr + ' style="' + styles + '">' + inner + '</a>'
            : '<span' + animAttr + ' style="' + styles + '">' + inner + '</span>';
          return '<div class="el-render text-' + (p.align || 'center') + '">' + content + '</div>';
        case 'button': {
          const animClass = p.animation === 'shake' ? ' btn-anim-shake' : p.animation === 'zoom' ? ' btn-anim-zoom' : '';
          const speedMap = { slow: 2.4, normal: 1.2, fast: 0.6 };
          const animDur = (p.animation && p.animation !== 'none') ? 'animation-duration:' + (speedMap[p.animSpeed] || 1.2) + 's;' : '';
          const widthStyle = p.fullWidth ? 'width:100%;' : '';
          const btnStyle = 'background:' + (p.bgColor || '#6366f1') + ';color:' + (p.textColor || '#ffffff') + ';border-radius:' + (Number(p.radius) || 12) + 'px;font-size:' + (Number(p.fontSize) || 15) + 'px;font-weight:' + (p.bold === false ? '400' : '700') + ';' + animDur + widthStyle;
          return '<div class="el-render"><a class="el-btn' + animClass + '" href="' + (p.link || '#') + '" style="' + btnStyle + '">' + escapeHtml(p.label || 'สั่งซื้อเลย') + '</a></div>';
        }
        case 'image':
          if (p.src) return '<div class="el-render"><img src="' + escapeHtml(p.src) + '" alt="' + escapeHtml(p.alt || '') + '"></div>';
          return '<div class="el-render"><div class="el-img-placeholder">รูปภาพ (กรอก URL ในคุณสมบัติ)</div></div>';
        case 'price':
          const old = p.oldAmount ? '<span class="old" style="font-size:' + Math.round((Number(p.fontSize) || 26) * 0.55) + 'px;">' + (p.currency || '฿') + Number(p.oldAmount).toLocaleString() + '</span>' : '';
          return '<div class="el-render"><div class="el-price"><span style="font-size:' + (Number(p.fontSize) || 26) + 'px;font-weight:800;color:#dc2626;">' + (p.currency || '฿') + Number(p.amount || 0).toLocaleString() + '</span>' + old + '</div></div>';
        case 'heading':
          return '<div class="el-render text-' + (p.align || 'center') + '"><span style="font-size:' + (Number(p.fontSize) || 26) + 'px;font-weight:' + (p.bold ? '700' : '400') + ';color:' + (p.color || '#101828') + ';line-height:1.4;word-break:break-word;">' + escapeHtml(p.text || 'หัวข้อของคุณ') + '</span></div>';
        case 'box':
          return '<div class="el-render"><div class="el-box" style="background:' + (p.bgColor || '#f4f5fb') + ';border:1.5px solid ' + (p.borderColor || '#d0d5dd') + ';border-radius:' + (Number(p.radius) || 16) + 'px;"></div></div>';
        case 'line':
          return '<div class="el-render"><a class="el-btn" href="https://line.me/R/ti/p/' + escapeHtml(String(p.lineId || '').replace(/^@/, '')) + '" target="_blank" rel="noopener" style="width:100%;height:100%;background:#06c755;color:#fff;border-radius:' + (Number(p.radius) || 12) + 'px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;">' +
            '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.5 2 2 5.8 2 10.5c0 2.6 1.4 5 3.7 6.5L5 20.5l3.5-1.9c1 .3 2.2.4 3.5.4 5.5 0 10-3.8 10-8.5S17.5 2 12 2z"/></svg>' +
            escapeHtml(p.label || 'แอดไลน์') + '</a></div>';
        case 'video':
          if (p.url) {
            const v = videoEmbedUrl(p.url);
            if (v) return '<div class="el-render"><iframe src="' + v + '" style="width:100%;height:100%;border:0;border-radius:12px;" allowfullscreen loading="lazy"></iframe></div>';
          }
          return '<div class="el-render"><div class="el-img-placeholder">วิดีโอ (วางลิงก์ YouTube/TikTok)</div></div>';
        case 'gallery':
          const imgs = (p.images || '').split('\n').map((s) => s.trim()).filter(Boolean);
          if (imgs.length) {
            return '<div class="el-render el-gallery">' + imgs.slice(0, 4).map((u) => '<img src="' + escapeHtml(u) + '" alt="">').join('') + '</div>';
          }
          return '<div class="el-render"><div class="el-img-placeholder">แกลเลอรี่ (URL รูป 1 บรรทัด/รูป)</div></div>';
        case 'countdown':
          return '<div class="el-render"><div class="el-countdown">' + countdownBoxes(p, el.id) + '</div></div>';
        case 'testimonial':
          return '<div class="el-render"><div class="el-testimonial">' + starsHtml(p.stars) + '<p class="t-text">' + escapeHtml(p.text || '') + '</p><span class="t-name">— ' + escapeHtml(p.name || 'ลูกค้า') + '</span></div></div>';
        case 'faq':
          const items = parseFaq(p.items);
          return '<div class="el-render"><div class="el-faq">' + items.map((it) => '<details><summary>' + escapeHtml(it.q) + '</summary><p>' + escapeHtml(it.a) + '</p></details>').join('') + '</div></div>';
      }
      return '';
    }

    // ---------- helpers สำหรับ element ใหม่ ----------
    function starsHtml(n) {
      n = Math.max(0, Math.min(5, Number(n) || 0));
      let s = '';
      for (let i = 0; i < 5; i++) s += i < n ? '★' : '☆';
      return '<span class="t-stars">' + s + '</span>';
    }
    function parseFaq(raw) {
      return String(raw || '').split('\n').map((line) => {
        const i = line.indexOf('|');
        if (i > -1) return { q: line.slice(0, i).trim(), a: line.slice(i + 1).trim() };
        return { q: line.trim(), a: '' };
      }).filter((x) => x.q);
    }
    // นับถอยหลังแบบเรียลไทม์: เก็บ total วินาทีที่เหลือต่อ element
    const cdTimers = {};   // elId -> total seconds คงเหลือ
    const cdIntervals = {}; // elId -> interval id

    function cdTotalSeconds(p) {
      if (p.mode === 'alarm') {
        // นาฬิกาปลูก: นับถอยหลังจนถึงวัน/เวลาที่ตั้ง
        if (!p.alarmDate) return 0;
        const dt = new Date(p.alarmDate + 'T' + (p.alarmTime || '23:59') + ':00');
        const secs = Math.max(0, Math.floor((dt.getTime() - Date.now()) / 1000));
        return secs;
      }
      return ((Number(p.days) || 0) * 86400) + ((Number(p.hours) || 0) * 3600) + ((Number(p.minutes) || 0) * 60) + (Number(p.seconds) || 0);
    }

    function countdownBoxes(p, elId) {
      // ใช้ค่าคงเหลือถ้ามี (เรียลไทม์) มิฉะนั้นจาก props
      let total = cdTimers[elId] !== undefined ? cdTimers[elId] : cdTotalSeconds(p);
      const d = Math.floor(total / 86400);
      const h = Math.floor((total % 86400) / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return '<div class="cd-label">' + escapeHtml(p.label || 'โปรโมชันหมดเขตใน') + '</div>' +
        '<div class="cd-boxes" data-el="' + elId + '">' +
        '<span class="cd-box"><b class="cd-d">' + d + '</b><i>วัน</i></span><em>:</em>' +
        '<span class="cd-box"><b class="cd-h">' + h + '</b><i>ชม</i></span><em>:</em>' +
        '<span class="cd-box"><b class="cd-m">' + m + '</b><i>นาที</i></span><em>:</em>' +
        '<span class="cd-box"><b class="cd-s">' + s + '</b><i>วิ</i></span>' +
        '</div>';
    }

    function startCountdownTimer(el) {
      if (cdIntervals[el.id]) clearInterval(cdIntervals[el.id]);
      if (cdTimers[el.id] === undefined) cdTimers[el.id] = cdTotalSeconds(el.props);
      const total = cdTimers[el.id];
      if (total <= 0) return;
      cdIntervals[el.id] = setInterval(() => {
        cdTimers[el.id] = Math.max(0, cdTimers[el.id] - 1);
        const t = cdTimers[el.id];
        const d = Math.floor(t / 86400);
        const h = Math.floor((t % 86400) / 3600);
        const m = Math.floor((t % 3600) / 60);
        const s = t % 60;
        const wrap = document.querySelector('.cd-boxes[data-el="' + el.id + '"]');
        if (!wrap) { clearInterval(cdIntervals[el.id]); return; }
        wrap.querySelector('.cd-d').textContent = d;
        wrap.querySelector('.cd-h').textContent = h;
        wrap.querySelector('.cd-m').textContent = m;
        wrap.querySelector('.cd-s').textContent = s;
      }, 1000);
    }

    function resetCountdownTimer(el) {
      cdTimers[el.id] = cdTotalSeconds(el.props);
      if (cdIntervals[el.id]) { clearInterval(cdIntervals[el.id]); cdIntervals[el.id] = null; }
    }
    function videoEmbedUrl(url) {
      const s = String(url || '').trim();
      const yt = s.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
      if (yt) return 'https://www.youtube.com/embed/' + yt[1];
      const tk = s.match(/tiktok\.com\/@[\w.-]+\/video\/(\d+)/);
      if (tk) return 'https://www.tiktok.com/embed/v2/' + tk[1];
      const em = s.match(/^https:\/\/\S+/);
      if (em && /(youtube|youtu|tiktok)/.test(s)) return s;
      return null;
    }

    function bgCss(bg) {
      const b = bg || { type: 'solid', color: '#ffffff' };
      if (b.type === 'gradient') {
        return b.gradient || 'linear-gradient(135deg,#6366f1,#c026d3)';
      }
      if (b.type === 'pattern') {
        const c = b.color || '#ffffff';
        const lc = b.lineColor || '#e4e7ec';
        const p = b.pattern || 'dots';
        if (p === 'lines-h') return 'repeating-linear-gradient(0deg,' + lc + ' 0 1px,transparent 1px 12px),' + c;
        if (p === 'lines-v') return 'repeating-linear-gradient(90deg,' + lc + ' 0 1px,transparent 1px 12px),' + c;
        if (p === 'grid') return 'repeating-linear-gradient(0deg,' + lc + ' 0 1px,transparent 1px 18px),repeating-linear-gradient(90deg,' + lc + ' 0 1px,transparent 1px 18px),' + c;
        // dots
        return 'radial-gradient(' + lc + ' 1.6px,transparent 1.6px) 0 0/18px 18px,' + c;
      }
      return b.color || '#ffffff';
    }

      // ชั้นพื้นหลังแยก (clip ริ้วแสงไม่ให้ล้นผ้าใบ) — องค์ประกอบวางทับด้านบน
      canvas.innerHTML = '<div class="canvas-bg' + (anim ? ' canvas-bg-anim' : '') + '"></div>' +
        elements.map((el) => {

        return '<div class="canvas-el' + sel + '" data-id="' + el.id + '" style="left:' + el.x + 'px;top:' + el.y + 'px;width:' + el.w + 'px;height:' + el.h + 'px;">' +

          '</button>' : '') +
          '<div class="resize-handle"></div>' +
        '</div>';
      }).join('');

      // เริ่มนับถอยหลังแบบเรียลไทม์ (ถ้ายังไม่มี timer — ไม่ reset ทุกครั้งที่ลาก/แก้)
      elements.forEach((el) => {
        if (el.type === 'countdown' && !cdIntervals[el.id]) {
          if (cdTimers[el.id] === undefined) cdTimers[el.id] = cdTotalSeconds(el.props);
          if (cdTimers[el.id] > 0) startCountdownTimer(el);
        }

          field('ความเร็ว', '<select class="props-select" id="prop_animSpeed">' +

        } else {

          html += '<div class="props-hint">วางลิงก์รูปภาพ (https://...) — รองรับ JPG/PNG/WebP</div>';
        }
        html += field('คำอธิบาย (alt)', '<input type="text" id="prop_alt" value="' + escapeHtml(p.alt || '') + '">');
        html += '</div>';
      } else if (el.type === 'price') {
        html += row(

          field('ราคาเดิม (ไม่บังคับ)', '<input type="number" id="prop_oldAmount" value="' + (p.oldAmount ? Number(p.oldAmount) : '') + '" min="0">')

        html += field('สกุลเงิน', '<input type="text" id="prop_currency" value="' + escapeHtml(p.currency || '฿') + '" maxlength="3">');
      } else if (el.type === 'heading') {
        html += '<div class="props-group"><div class="props-group-title">หัวข้อ</div>';
        html += field('ข้อความ', '<input type="text" id="prop_text" value="' + escapeHtml(p.text || '') + '">');
        html += row(

        );
        html += row(

          field('ตัวหนา', '<label class="props-check' + (p.bold ? ' on' : '') + '" for="prop_bold"><input type="checkbox" id="prop_bold"' + (p.bold ? ' checked' : '') + '><span>B</span>ตัวหนา</label>')

          field('สีขอบ', '<button class="cp-swatch" type="button" data-prop="borderColor" data-el="' + el.id + '" style="background:' + (p.borderColor || '#d0d5dd') + ';"></button>')

        );

      } else if (el.type === 'line') {
        html += '<div class="props-group"><div class="props-group-title">ปุ่มไลน์</div>';
        html += field('LINE ID', '<input type="text" id="prop_lineId" value="' + escapeHtml(p.lineId || '@salepage') + '" placeholder="@salepage">');
        html += field('ข้อความบนปุ่ม', '<input type="text" id="prop_label" value="' + escapeHtml(p.label || 'แอดไลน์') + '">');
        html += field('มุมโค้ง', '<input type="number" id="prop_radius" value="' + (Number(p.radius) || 12) + '" min="0" max="30">');
        html += '</div>';
      } else if (el.type === 'video') {
        html += '<div class="props-group"><div class="props-group-title">วิดีโอ</div>';
        html += field('ลิงก์วิดีโอ', '<input type="url" id="prop_url" value="' + escapeHtml(p.url || '') + '" placeholder="https://youtube.com/watch?v=...">');
        html += '<div class="props-hint">รองรับ YouTube / TikTok — วางลิงก์จากปุ่มแชร์</div>';

      } else if (el.type === 'gallery') {
        html += '<div class="props-group"><div class="props-group-title">แกลเลอรี่</div>';
        html += field('URL รูปภาพ (1 บรรทัด/รูป)', '<textarea id="prop_images" rows="4" style="width:100%;padding:9px 12px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;outline:none;resize:vertical;">' + escapeHtml(p.images || '') + '</textarea>');
        html += '</div>';
      } else if (el.type === 'countdown') {
        const isAlarm = p.mode === 'alarm';
        html += '<div class="props-group"><div class="props-group-title">นับถอยหลัง</div>';
        html += '<div class="props-check-grid">' +
          '<label class="props-check' + (!isAlarm ? ' on' : '') + '" for="cd_mode_timer"><input type="radio" name="cdmode" id="cd_mode_timer" value="timer"' + (!isAlarm ? ' checked' : '') + '><span>⏱</span>นับเวลา</label>' +
          '<label class="props-check' + (isAlarm ? ' on' : '') + '" for="cd_mode_alarm"><input type="radio" name="cdmode" id="cd_mode_alarm" value="alarm"' + (isAlarm ? ' checked' : '') + '><span>⏰</span>นาฬิกาปลูก</label>' +
        '</div>';
        html += field('ข้อความ (เช่น โปรโมชันหมดเขตใน)', '<input type="text" id="prop_label" value="' + escapeHtml(p.label || 'โปรโมชันหมดเขตใน') + '">');
        if (isAlarm) {
          html += row(
            field('วันที่สิ้นสุด', '<input type="date" id="prop_alarmDate" value="' + escapeHtml(p.alarmDate || '') + '">'),
            field('เวลา', '<input type="time" id="prop_alarmTime" value="' + escapeHtml(p.alarmTime || '23:59') + '">')
          );
          html += '<div class="props-hint">นับถอยหลังจนถึงวัน/เวลาที่ตั้ง (นาฬิกาปลูก)</div>';
        } else {
          html += row(
            field('วัน', '<input type="number" id="prop_days" value="' + (Number(p.days) || 0) + '" min="0" max="30">'),
            field('ชั่วโมง', '<input type="number" id="prop_hours" value="' + (Number(p.hours) || 0) + '" min="0" max="23">')
          );
          html += row(
            field('นาที', '<input type="number" id="prop_minutes" value="' + (Number(p.minutes) || 0) + '" min="0" max="59">'),
            field('วินาที', '<input type="number" id="prop_seconds" value="' + (Number(p.seconds) || 0) + '" min="0" max="59">')
          );
        }
        html += '</div>';
      } else if (el.type === 'testimonial') {
        html += '<div class="props-group"><div class="props-group-title">รีวิวลูกค้า</div>';
        html += field('ข้อความรีวิว', '<textarea id="prop_text" rows="3" style="width:100%;padding:9px 12px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;outline:none;resize:vertical;">' + escapeHtml(p.text || '') + '</textarea>');
        html += row(
          field('ชื่อลูกค้า', '<input type="text" id="prop_name" value="' + escapeHtml(p.name || '') + '">'),
          field('ดาว (1-5)', '<input type="number" id="prop_stars" value="' + (Number(p.stars) || 5) + '" min="1" max="5">')
        );
        html += '</div>';
      } else if (el.type === 'faq') {
        html += '<div class="props-group"><div class="props-group-title">คำถามที่พบบ่อย</div>';
        html += field('คำถาม|คำตอบ (1 บรรทัด/ข้อ)', '<textarea id="prop_items" rows="5" style="width:100%;padding:9px 12px;font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;outline:none;resize:vertical;">' + escapeHtml(p.items || '') + '</textarea>');
        html += '</div>';
      }

      panelProps.innerHTML = '<div class="props-wrap">' + html + '</div>';
      bindProps(el);
    }

    function field(label, inner) {
      return '<div class="props-field"><label>' + label + '</label>' + inner + '</div>';
    }
    function row(a, b) {
      return '<div class="props-row">' + a + b + '</div>';
    }

    function bindProps(el) {
      const bind = (id, key, transform) => {
        const node = document.getElementById(id);
        if (!node) return;
        node.addEventListener('input', () => {
          if (node.type === 'checkbox') {
            el.props[key] = node.checked;
            // อัปเดตเฉพาะปุ่ม checkbox (ไม่ render ทั้งแผง — กันโฟกัสหลุด)
            const label = node.closest('.props-check');
            if (label) label.classList.toggle('on', node.checked);
          } else {
            const val = transform ? transform(node.value) : node.value;
            el.props[key] = val;
          }
          dirty = true;
          renderCanvas();
          // ไม่เรียก renderProps() — จะสร้าง input ใหม่ให้โฟกัสหลุดทุกตัวอักษร
        });
      };
      if (el.type === 'text') {
        bind('prop_text', 'text');
        bind('prop_fontSize', 'fontSize', (v) => Math.max(10, Math.min(80, Number(v) || 16)));
        bind('prop_fontFamily', 'fontFamily');
        bind('prop_align', 'align');
        bind('prop_lineHeight', 'lineHeight', (v) => Math.max(0.8, Math.min(3, Number(v) || 1.5)));
        bind('prop_letterSpacing', 'letterSpacing', (v) => Math.max(0, Math.min(10, Number(v) || 0)));
        bind('prop_bold', 'bold');
        bind('prop_italic', 'italic');
        bind('prop_underline', 'underline');
        bind('prop_uppercase', 'uppercase');
        bind('prop_animation', 'animation');
        bind('prop_shadowBlur', 'shadowBlur', (v) => Number(v) || 0);
        bind('prop_link', 'link');
      } else if (el.type === 'button') {
        bind('prop_label', 'label');
        bind('prop_radius', 'radius', (v) => Math.max(0, Math.min(30, Number(v) || 0)));
        bind('prop_fontSize', 'fontSize', (v) => Math.max(10, Math.min(50, Number(v) || 15)));
        bind('prop_bold', 'bold');
        bind('prop_fullWidth', 'fullWidth');
        bind('prop_animation', 'animation');
        bind('prop_animSpeed', 'animSpeed');
        bind('prop_link', 'link');
      } else if (el.type === 'image') {
        bind('prop_src', 'src');
        bind('prop_alt', 'alt');
        // สลับโหมด URL / อัปโหลด
        panelProps.querySelectorAll('input[name="imgmode"]').forEach((r) => {
          r.addEventListener('change', () => {
            el.props.upload = r.value === 'upload';
            dirty = true;
            renderProps();
          });
        });
        // อัปโหลดไฟล์
        const fileInput = document.getElementById('prop_file');
        if (fileInput) {
          fileInput.addEventListener('change', async () => {
            const file = fileInput.files && fileInput.files[0];
            if (!file) return;
            const status = document.getElementById('uploadStatus');
            if (status) status.textContent = 'กำลังอัปโหลด...';
            try {
              const res = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': file.type },
                body: file,
              });
              const data = await res.json();
              if (!data.ok) throw new Error(data.message || 'อัปโหลดไม่สำเร็จ');
              el.props.src = data.url;
              el.props.upload = true;
              dirty = true;
              renderCanvas();
              renderProps();
            } catch (err) {
              if (status) status.textContent = 'อัปโหลดไม่สำเร็จ: ' + err.message;
            }
          });
        }
      } else if (el.type === 'price') {
        bind('prop_amount', 'amount', (v) => Math.max(0, Number(v) || 0));
        bind('prop_oldAmount', 'oldAmount', (v) => (v === '' ? null : Math.max(0, Number(v) || 0)));
        bind('prop_currency', 'currency');
      } else if (el.type === 'heading') {
        bind('prop_text', 'text');
        bind('prop_fontSize', 'fontSize', (v) => Math.max(12, Math.min(80, Number(v) || 26)));
        bind('prop_align', 'align');
        bind('prop_bold', 'bold');
      } else if (el.type === 'box') {
        bind('prop_radius', 'radius', (v) => Math.max(0, Math.min(40, Number(v) || 16)));
        bind('prop_height', 'height', (v) => Math.max(40, Math.min(800, Number(v) || 200)));
      } else if (el.type === 'line') {
        bind('prop_lineId', 'lineId');
        bind('prop_label', 'label');
        bind('prop_radius', 'radius', (v) => Math.max(0, Math.min(30, Number(v) || 12)));
      } else if (el.type === 'video') {
        bind('prop_url', 'url');
      } else if (el.type === 'gallery') {
        bind('prop_images', 'images');
      } else if (el.type === 'countdown') {
        // ช่องเวลานับถอยหลัง — อัปเดต props + reset timer ทันที (ไม่รอ change)
        const bindCd = (id, key, transform) => {
          const node = document.getElementById(id);
          if (!node) return;
          node.addEventListener('input', () => {
            el.props[key] = transform ? transform(node.value) : node.value;
            dirty = true;
            resetCountdownTimer(el);
            renderCanvas();
          });
        };
        bindCd('prop_days', 'days', (v) => Math.max(0, Math.min(30, Number(v) || 0)));
        bindCd('prop_hours', 'hours', (v) => Math.max(0, Math.min(23, Number(v) || 0)));
        bindCd('prop_minutes', 'minutes', (v) => Math.max(0, Math.min(59, Number(v) || 0)));
        bindCd('prop_seconds', 'seconds', (v) => Math.max(0, Math.min(59, Number(v) || 0)));
        bindCd('prop_alarmDate', 'alarmDate');
        bindCd('prop_alarmTime', 'alarmTime');
        bind('prop_label', 'label');
        // สลับโหมด นับเวลา / นาฬิกาปลูก
        panelProps.querySelectorAll('input[name="cdmode"]').forEach((r) => {
          r.addEventListener('change', () => {
            el.props.mode = r.value;
            dirty = true;
            resetCountdownTimer(el);
            renderCanvas();
            renderProps();
          });
        });
      } else if (el.type === 'testimonial') {
        bind('prop_text', 'text');
        bind('prop_name', 'name');
        bind('prop_stars', 'stars', (v) => Math.max(1, Math.min(5, Number(v) || 5)));
      } else if (el.type === 'faq') {
        bind('prop_items', 'items');
      }
    }

    // ============================================================
    // ปุ่มลบเล็ก ๆ บน element ที่เลือก + คลิกเลือก
    // ============================================================
    canvas.addEventListener('click', (e) => {
      const delBtn = e.target.closest('.el-del-btn');
      if (delBtn) {
        const id = delBtn.dataset.del;
        elements = elements.filter((x) => x.id !== id);
        if (selectedId === id) selectedId = null;
        dirty = true;
        renderAll();
        // สลับไปแท็บเลเยอร์ (เห็นรายการเหลือ)
        document.getElementById('panelBg').style.display = 'none';
        panelProps.style.display = 'none';
        panelLayers.style.display = '';
        document.querySelectorAll('.panel-tab').forEach((t) => t.classList.remove('active'));
        document.querySelector('.panel-tab[data-tab="layers"]').classList.add('active');
        return;
      }
      const elDiv = e.target.closest('.canvas-el');
      if (elDiv && selectedId !== elDiv.dataset.id) selectElement(elDiv.dataset.id);
    });

    // ============================================================
    // ลากย้าย + ปรับขนาด (pointer events)
    // ============================================================
    let drag = null;
    let currentZoom = 1;   // scale ปัจจุบันของผ้าใบ (จากซูมหรือมุมมองอุปกรณ์)

    canvas.addEventListener('pointerdown', (e) => {
      const elDiv = e.target.closest('.canvas-el');
      if (!elDiv) { selectElement(null); return; }

      const id = elDiv.dataset.id;
      const el = elements.find((x) => x.id === id);
      if (!el) return;

      // เลือก element (ถ้ายังไม่เลือก ให้เลือกก่อนแล้วไม่ลากทันที)
      if (selectedId !== id) {
        selectElement(id);
        return;
      }

      const handle = e.target.closest('.resize-handle');
      const inv = 1 / (currentZoom || 1);  // พิกัดผ้าใบจริง = พิกัดหน้าจอ ÷ zoom

      drag = {
        id,
        mode: handle ? 'resize' : 'move',
        startX: e.clientX,
        startY: e.clientY,
        origX: el.x,
        origY: el.y,
        origW: el.w,
        origH: el.h,
        scaleX: inv,
        scaleY: inv,
      };
      e.preventDefault();
    });

    window.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const el = elements.find((x) => x.id === drag.id);
      if (!el) return;
      const dx = (e.clientX - drag.startX) * drag.scaleX;
      const dy = (e.clientY - drag.startY) * drag.scaleY;
      if (drag.mode === 'move') {
        el.x = Math.max(0, Math.round(drag.origX + dx));
        el.y = Math.max(0, Math.round(drag.origY + dy));
      } else {
        el.w = Math.max(40, Math.round(drag.origW + dx));
        el.h = Math.max(20, Math.round(drag.origH + dy));
      }
      dirty = true;
      renderCanvas();
    });

    window.addEventListener('pointerup', () => { drag = null; });

    // ============================================================
    // ตัวเลือกสีแบบกำหนดเอง — ลากดูตัวอย่างได้ (คลิกปุ่ม swatch)
    // ============================================================
    const PRESET_COLORS = ['#101828', '#475467', '#98a2b3', '#f9fafb', '#ffffff', '#000000',
      '#dc2626', '#ea580c', '#f59e0b', '#059669', '#0891b2', '#2563eb',
      '#6366f1', '#8b5cf6', '#db2777', '#ec4899', '#e11d48', '#14b8a6'];
    const cpPop = document.getElementById('cpPop');
    const cpSv = document.getElementById('cpSv');
    const cpHue = document.getElementById('cpHue');
    const cpSwatches = document.getElementById('cpSwatches');
    const cpHex = document.getElementById('cpHex');
    const cpPreview = document.getElementById('cpPreview');

    let cpTarget = null;  // { elId, prop }
    let cpHsv = { h: 0, s: 0, v: 1 };

    function hexToHsv(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
      if (!m) return { h: 0, s: 0, v: 1 };
      const n = parseInt(m[1], 16);
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h = 0;
      if (d) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      return { h, s: max ? d / max : 0, v: max / 255 };
    }

    function hsvToHex(h, s, v) {
      const c = v * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const mm = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      const to = (v2) => Math.round((v2 + mm) * 255).toString(16).padStart(2, '0');
      return '#' + to(r) + to(g) + to(b);
    }

    function cpPaint() {
      const hue = hsvToHex(cpHsv.h, 1, 1);
      cpSv.style.background = 'linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, ' + hue + ')';
      const sx = cpHsv.s * 100, sy = (1 - cpHsv.v) * 100;
      const sHandle = cpSv.querySelector('.cp-sv-handle');
      sHandle.style.left = sx + '%';
      sHandle.style.top = sy + '%';
      const hx = (cpHsv.h / 360) * 100;
      cpHue.querySelector('.cp-hue-handle').style.left = hx + '%';
      const hex = hsvToHex(cpHsv.h, cpHsv.s, cpHsv.v);
      cpPreview.style.background = hex;
      cpHex.value = hex;
      return hex;
    }

    function cpApply(hex, final) {
      if (!cpTarget) return;
      if (cpTarget.elId === '__bg') {
        // พื้นหลังเพจ
        const key = cpTarget.prop === 'lineColor' ? 'lineColor' : 'color';
        setBg({ [key]: hex });
        if (final) renderBg();
        return;
      }
      const el = elements.find((e) => e.id === cpTarget.elId);
      if (!el) return;
      el.props[cpTarget.prop] = hex;
      dirty = true;
      renderCanvas();
      if (final) renderProps();  // อัปเดตสีปุ่ม swatch
    }

    function cpOpen(btn, elId, prop) {
      cpTarget = { elId, prop };
      let cur = '#101828';
      if (elId === '__bg') {
        cur = prop === 'lineColor' ? (pageBg.lineColor || '#e4e7ec') : (pageBg.color || '#ffffff');
      } else {
        const el = elements.find((e) => e.id === elId);
        if (el && el.props[prop]) cur = el.props[prop];
      }
      cpHsv = hexToHsv(cur);
      cpSwatches.innerHTML = PRESET_COLORS.map((c) =>
        '<button class="cp-swatch-s" type="button" data-c="' + c + '" style="background:' + c + ';"' + (c === cur ? ' title="สีปัจจุบัน"' : '') + '></button>'
      ).join('');
      cpPaint();
      cpPop.style.display = 'block';
      // จัดตำแหน่ง popover ใกล้ปุ่ม (กันล้นขอบขวา)
      const r = btn.getBoundingClientRect();
      const popW = 236;
      let left = r.left;
      if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
      let top = r.bottom + 6;
      if (top + 280 > window.innerHeight - 8) top = r.top - 286;
      cpPop.style.left = Math.max(8, left) + 'px';
      cpPop.style.top = Math.max(8, top) + 'px';
    }

    function cpClose() {
      cpPop.style.display = 'none';
      cpTarget = null;
    }

    // คลิกปุ่ม swatch ในแผงคุณสมบัติ → เปิดตัวเลือกสี
    panelProps.addEventListener('click', (e) => {
      const sw = e.target.closest('.cp-swatch');
      if (sw) {
        cpOpen(sw, sw.dataset.el, sw.dataset.prop);
      }
    });

    // คลิกสีสำเร็จรูปใน popover → ใช้สีทันที
    cpSwatches.addEventListener('click', (e) => {
      const preset = e.target.closest('.cp-swatch-s');
      if (preset) {
        cpHsv = hexToHsv(preset.dataset.c);
        cpPaint();
        cpApply(preset.dataset.c, true);
      }
    });

    // ลากบนจานสี (SV) — ดูสีเปลี่ยนทันที
    cpSv.addEventListener('pointerdown', (e) => {
      cpSv.setPointerCapture(e.pointerId);
      const rect = cpSv.getBoundingClientRect();
      cpHsv.s = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      cpHsv.v = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
      cpApply(cpPaint(), false);
    });
    cpSv.addEventListener('pointermove', (e) => {
      if (!cpSv.hasPointerCapture(e.pointerId)) return;
      const rect = cpSv.getBoundingClientRect();
      cpHsv.s = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      cpHsv.v = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
      cpApply(cpPaint(), false);
    });
    cpSv.addEventListener('pointerup', () => { cpApply(cpPaint(), true); });

    // ลากบนแถบสี (hue)
    cpHue.addEventListener('pointerdown', (e) => {
      cpHue.setPointerCapture(e.pointerId);
      const rect = cpHue.getBoundingClientRect();
      cpHsv.h = Math.max(0, Math.min(360, ((e.clientX - rect.left) / rect.width) * 360));
      cpApply(cpPaint(), false);
    });
    cpHue.addEventListener('pointermove', (e) => {
      if (!cpHue.hasPointerCapture(e.pointerId)) return;
      const rect = cpHue.getBoundingClientRect();
      cpHsv.h = Math.max(0, Math.min(360, ((e.clientX - rect.left) / rect.width) * 360));
      cpApply(cpPaint(), false);
    });
    cpHue.addEventListener('pointerup', () => { cpApply(cpPaint(), true); });

    // กรอก hex ตรง ๆ (Enter / blur / พิมพ์ครบ 6 หลัก)
    function cpApplyHex() {
      const hex = cpHex.value.trim();
      if (/^#?[0-9a-f]{6}$/i.test(hex)) {
        const full = hex.startsWith('#') ? hex : '#' + hex;
        cpHsv = hexToHsv(full);
        cpPaint();
        cpApply(full, true);
      }
    }
    cpHex.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); cpApplyHex(); } });
    cpHex.addEventListener('change', cpApplyHex);
    cpHex.addEventListener('input', () => {
      const v = cpHex.value.trim();
      if (/^#?[0-9a-f]{6}$/i.test(v)) cpApplyHex();
    });

    // คลิกนอก popover → ปิด
    document.addEventListener('pointerdown', (e) => {
      if (cpPop.style.display === 'block' && !cpPop.contains(e.target) && !e.target.closest('.cp-swatch')) {
        cpClose();
      }
    });

    // ============================================================
    // เลเยอร์: ตั้งชื่อ (ดับเบิลคลิก) + ลากสลับลำดับ + ลบ + เลือก
    // ============================================================
    let renamingId = null;
    let layerDrag = null;  // { id, startY, index, moved }
    let lastLayerClick = null;  // { id, time } — นับ double-click เอง

    function layerIndex(id) { return elements.findIndex((e) => e.id === id); }

    // เริ่มตั้งชื่อ (ดับเบิลคลิกที่รายการ)
    function startRename(el) {
      if (renamingId) return;
      renamingId = el.id;
      const item = panelLayers.querySelector('.layer-item[data-id="' + el.id + '"]');
      if (!item) { renamingId = null; return; }
      const nameEl = item.querySelector('.l-name');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'layer-rename';
      input.value = layerName(el);
      input.maxLength = 30;
      nameEl.replaceWith(input);
      input.focus();
      input.select();

      const commit = () => {
        if (renamingId !== el.id) return;
        const val = input.value.trim();
        el.name = val || '';
        renamingId = null;
        renderLayers();
        dirty = true;
      };
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
        if (ev.key === 'Escape') { renamingId = null; renderLayers(); }
      });
      input.addEventListener('blur', commit);
      input.addEventListener('click', (ev) => ev.stopPropagation());
    }

    // เริ่มลากสลับลำดับ (กดค้างที่รายการ)
    panelLayers.addEventListener('pointerdown', (e) => {
      const item = e.target.closest('.layer-item');
      if (!item || e.target.closest('.l-del') || e.target.closest('input')) return;
      const id = item.dataset.id;
      item.classList.add('dragging');
      layerDrag = {
        id,
        startY: e.clientY,
        index: layerIndex(id),
        moved: false,
      };
      // ไม่ preventDefault — กันไม่ให้บล็อก dblclick (ใช้ pointermove จัดการลาก)
    });

    window.addEventListener('pointermove', (e) => {
      if (!layerDrag) return;
      const dy = e.clientY - layerDrag.startY;
      if (Math.abs(dy) < 6) return;
      layerDrag.moved = true;

      const itemEls = [...panelLayers.querySelectorAll('.layer-item')];
      const from = layerIndex(layerDrag.id);
      if (from === -1) return;
      const currentTop = itemEls[from] ? itemEls[from].getBoundingClientRect().top : 0;
      let to = from;
      if (dy > 0) {
        for (let i = from + 1; i < itemEls.length; i++) {
          const r = itemEls[i].getBoundingClientRect();
          if (currentTop + dy > r.top + r.height / 2) to = i;
        }
      } else {
        for (let i = from - 1; i >= 0; i--) {
          const r = itemEls[i].getBoundingClientRect();
          if (currentTop + dy < r.top + r.height / 2) to = i;
        }
      }
      if (to !== from) {
        const [moved] = elements.splice(from, 1);
        elements.splice(to, 0, moved);
        dirty = true;
        renderCanvas();
        renderLayers();
        // ไฮไลต์รายการที่กำลังลากต่อ
        const d = panelLayers.querySelector('.layer-item[data-id="' + layerDrag.id + '"]');
        if (d) d.classList.add('dragging');
        layerDrag.startY = e.clientY;
        layerDrag.index = to;
      }
    });

    window.addEventListener('pointerup', () => {
      if (layerDrag) {
        if (layerDrag.moved) { dirty = true; renderLayers(); }
        layerDrag = null;
      }
    });

    panelLayers.addEventListener('click', (e) => {
      const delBtn = e.target.closest('.l-del');
      if (delBtn) {
        const id = delBtn.dataset.del;
        elements = elements.filter((x) => x.id !== id);
        if (selectedId === id) selectedId = null;
        dirty = true;
        renderAll();
        return;
      }
      const item = e.target.closest('.layer-item');
      if (!item) return;

      const id = item.dataset.id;
      const now = Date.now();

      // ดับเบิลคลิก (2 คลิกใน 350ms บนรายการเดียวกัน) → ตั้งชื่อ
      if (lastLayerClick && lastLayerClick.id === id && now - lastLayerClick.time < 350) {
        lastLayerClick = null;
        const el = elements.find((x) => x.id === id);
        if (el) startRename(el);
        return;
      }
      lastLayerClick = { id, time: now };

      if (renamingId) return;
      selectElement(id);
    });

    // เครื่องมือซ้าย — เพิ่ม element ลงผ้าใบ
    document.querySelectorAll('.tool-btn[data-type]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach((t) => t.classList.remove('active'));
        document.getElementById('bgToolBtn').classList.remove('active');
        const maxY = elements.reduce((m, e) => Math.max(m, e.y + e.h), 0);
        addElement(btn.dataset.type, Math.max(20, maxY + 20));
      });
    });

    document.querySelectorAll('.panel-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.panel-tab').forEach((t) => t.classList.remove('active'));
        document.querySelectorAll('.tool-btn').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        const t = tab.dataset.tab;
        panelLayers.style.display = t === 'layers' ? '' : 'none';
        panelProps.style.display = t === 'props' ? '' : 'none';
        document.getElementById('panelBg').style.display = 'none';
      });
    });

    // ปุ่ม "พื้นหลัง" ในแถบเครื่องมือซ้าย → เปิดแผงพื้นหลัง
    document.getElementById('bgToolBtn').addEventListener('click', () => {
      document.querySelectorAll('.panel-tab').forEach((t) => t.classList.remove('active'));
      document.querySelectorAll('.tool-btn').forEach((t) => t.classList.remove('active'));
      document.getElementById('bgToolBtn').classList.add('active');
      panelLayers.style.display = 'none';
      panelProps.style.display = 'none';
      document.getElementById('panelBg').style.display = '';
      renderBg();
    });

    // ---------- ซูม/มุมมองอุปกรณ์ ----------
    const zoomSelect = document.getElementById('zoomSelect');

    function applyZoom(z) {
      currentZoom = z;
      canvas.style.transform = 'scale(' + z + ')';
      canvas.style.marginBottom = (canvas.offsetHeight * (1 - z)) + 'px';
      canvasScroll.scrollTop = 0;
    }

    zoomSelect.addEventListener('change', () => {
      applyZoom(Number(zoomSelect.value) || 1);
      // เมื่อเลือกซูมเอง ให้ปุ่มอุปกรณ์หลุด active
      document.querySelectorAll('.device-btn').forEach((b) => b.classList.remove('active'));
    });

    // ปุ่มสลับมุมมองอุปกรณ์
    document.querySelectorAll('.device-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.device-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const device = btn.dataset.device;
        let z = 1;
        if (device === 'tablet') {
          z = 768 / CANVAS_W;                 // ผ้าใบแสดงกว้างเท่าแท็บเล็ต 768px
        } else if (device === 'desktop') {
          const avail = (canvasScroll.clientWidth || 1200) - 80;
          z = Math.max(1, Math.min(6, avail / CANVAS_W)); // เติมพื้นที่ว่าง (กันเกิน 6x บนจอ ultra-wide)
        }
        zoomSelect.value = String(Math.round(z * 100) / 100);
        applyZoom(z);
      });
    });

    // ============================================================
    // เซฟ + เผยแพร่
    // ============================================================
    const saveBtn = document.getElementById('saveBtn');
    const publishBtn = document.getElementById('publishBtn');
    const tbSaved = document.getElementById('tbSaved');
    const tbBadge = document.getElementById('tbBadge');
    const viewLink = document.getElementById('viewLink');

    async function savePage(silent) {
      saveBtn.disabled = true;
      saveBtn.classList.add('loading');
      try {
        const res = await fetch('/api/pages/' + pageId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: { elements, background: pageBg } }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.message);
        dirty = false;
        tbSaved.textContent = 'บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      } catch (err) {
        if (!silent) alert(err.message || 'เซฟไม่สำเร็จ');
      } finally {
        saveBtn.disabled = false;
        saveBtn.classList.remove('loading');
      }
    }

    saveBtn.addEventListener('click', () => savePage(false));

    publishBtn.addEventListener('click', async () => {
      await savePage(true);
      publishBtn.disabled = true;
      publishBtn.classList.add('loading');
      try {
        const res = await fetch('/api/pages/' + pageId + '/publish', { method: 'POST' });
        const data = await res.json();
        if (!data.ok) throw new Error(data.message);
        tbBadge.textContent = 'เผยแพร่แล้ว';
        tbBadge.classList.add('published');
        viewLink.style.display = '';
        viewLink.href = data.url;
        alert('เผยแพร่เพจแล้ว! เปิดดูได้ที่ ' + window.location.origin + data.url);
      } catch (err) {
        alert(err.message || 'เผยแพร่ไม่สำเร็จ');
      } finally {
        publishBtn.disabled = false;
        publishBtn.classList.remove('loading');
      }
    });

    // ============================================================
    // โหลดข้อมูลเพจ
    // ============================================================
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    (async function init() {
      if (!pageRef) { window.location.href = '/dashboard/pages'; return; }
      try {
        // โหลดด้วย slug (รองรับ id เก่าด้วย — เซิร์ฟเวอร์ redirect แล้ว)
        const res = await fetch('/api/pages/slug/' + encodeURIComponent(pageRef));
        const data = await res.json();
        if (!data.ok) {
          // fallback: โหลดด้วย id
          const res2 = await fetch('/api/pages/' + encodeURIComponent(pageRef));
          const data2 = await res2.json();
          if (!data2.ok) { window.location.href = '/dashboard/pages'; return; }
          page = data2.page;
          pageId = page.id;
          if (page.slug) history.replaceState(null, '', '/dashboard/pages/' + page.slug + '/editor');
        } else {
          page = data.page;
          pageId = page.id;
        }
        elements = (page.content && Array.isArray(page.content.elements)) ? page.content.elements : [];
        pageBg = (page.content && page.content.background) || { type: 'solid', color: '#ffffff' };
        document.getElementById('tbTitle').textContent = page.title || page.slug;
        document.title = 'ตัวสร้างเพจ ' + (page.title || page.slug) + ' | SalePage Builder';
        if (page.status === 'published') {
          tbBadge.textContent = 'เผยแพร่แล้ว';
          tbBadge.classList.add('published');
          viewLink.style.display = '';
          viewLink.href = '/p/' + page.slug;
        }
        renderAll();
      } catch (e) {
        window.location.href = '/dashboard/pages';
      }
    })();
  </script>
</body>
