<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสมาชิก</title>
  <meta name="description" content="ระบบสมาชิก: สมัครสมาชิก ยืนยันตัวตน เข้าสู่ระบบ และจัดการบัญชี">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <style>
    .home-hero {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 72px;
      text-align: center;
    }
    .home-hero h1 {
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.3;
      margin: 0 0 18px;
    }
    .home-hero p {
      font-size: 17px;
      line-height: 1.8;
      color: var(--muted);
      margin: 0 auto 32px;
      max-width: 540px;
    }
    .home-hero-cta {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .home-hero-cta .btn { width: auto; }
    @media (max-width: 520px) {
      .home-hero { padding: 56px 16px 48px; }
      .home-hero h1 { font-size: 30px; }
      .site-nav { padding: 12px 14px; }
      .site-nav .brand-name { font-size: 16px; }
    }
    .home-footer {
      border-top: 1px solid var(--border);
      margin-top: 48px;
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .home-footer a { color: var(--muted); }
    .home-footer a:hover { color: var(--accent); }
  </style>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/">
      <div class="brand-logo"><img src="/img/logo.svg" alt="QPage"></div>
      <span class="brand-name">ระบบสมาชิก</span>
    </a>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="theme-toggle" type="button" aria-label="สลับธีม" style="position:static;">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" style="display:none">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none">
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span id="authButtons">
        <a class="btn btn-outline btn-small" href="login.html">เข้าสู่ระบบ</a>
        <a class="btn btn-primary btn-small" href="register.html">สมัครสมาชิก</a>
      </span>
    </div>
  </nav>

  <header class="home-hero">
    <h1>ยินดีต้อนรับสู่ระบบสมาชิก</h1>
    <p>สมัครสมาชิก ยืนยันตัวตน และเข้าสู่ระบบเพื่อจัดการบัญชีของคุณได้ในที่เดียว</p>
    <div class="home-hero-cta" id="heroCta">
      <a class="btn btn-primary" href="register.html">สมัครสมาชิกฟรี</a>
      <a class="btn btn-outline" href="login.html">เข้าสู่ระบบ</a>
    </div>
  </header>

  <footer class="home-footer">
    <div>
      <a href="privacy.html">นโยบายความเป็นส่วนตัว</a>
      &nbsp;·&nbsp;
      <a href="login.html">เข้าสู่ระบบ</a>
      &nbsp;·&nbsp;
      <a href="register.html">สมัครสมาชิก</a>
    </div>
    <div style="margin-top:10px;">© 2026 ระบบสมาชิก — สงวนลิขสิทธิ์</div>
  </footer>

  <script>
    // เปลี่ยนปุ่มตามสถานะล็อกอิน
    async function initNav() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (!data.ok) return;
        const u = data.user;
        // บัญชียังยืนยันเบอร์ไม่ครบ → ยังไม่ถือว่าสมัครเสร็จ ให้ไปทำขั้นตอนให้ครบก่อน
        if (u.status !== 'active') {
          const target = u.provider === 'google' ? '/google-setup.html' : '/otp.html';
          const html = '<a class="btn btn-primary btn-small" href="' + target + '">ทำขั้นตอนสมัครให้ครบ</a>';
          document.getElementById('authButtons').innerHTML = html;
          document.getElementById('heroCta').innerHTML =
            '<a class="btn btn-primary" href="' + target + '">ทำขั้นตอนสมัครให้ครบ</a>';
          return;
        }
        const account = '<a class="btn btn-primary btn-small" href="/settings/profile">บัญชีของฉัน</a>';
        document.getElementById('authButtons').innerHTML = account;
        document.getElementById('heroCta').innerHTML =
          '<a class="btn btn-primary" href="/settings/profile">ไปที่บัญชีของฉัน</a>';
      } catch (e) { /* ยังไม่ล็อกอิน */ }
    }

    initNav();
  </script>
</body>
</html>
